name: Auto-merge feature branches

on:
  push:
    branches:
      - 'claude/**'
      - 'cursor/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted script from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: _main
          sparse-checkout: scripts/check_consistency.py
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: _feature
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run consistency check
        run: python _main/scripts/check_consistency.py --root _feature

      - name: Validate HTML
        run: |
          python3 -c "
import html.parser, pathlib, sys
class Validator(html.parser.HTMLParser):
    def __init__(self):
        super().__init__(convert_charrefs=False)
        self.errors = []
    def unknown_decl(self, data):
        self.errors.append(f'Unknown declaration: {data}')
p = Validator()
try:
    p.feed(pathlib.Path('_feature/index.html').read_text(encoding='utf-8'))
except Exception as e:
    print(f'Parse error: {e}'); sys.exit(1)
if p.errors:
    [print(e) for e in p.errors]; sys.exit(1)
print('HTML syntax OK')
"

  automerge-to-main:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for merge conflicts
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-commit --no-ff "origin/$BRANCH_NAME" \
            || { git merge --abort; echo "::error::Merge conflict in $BRANCH_NAME"; exit 1; }
          git merge --abort 2>/dev/null || true

      - name: Merge into main
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git checkout -B main origin/main
          git merge --no-ff "origin/$BRANCH_NAME" -m "Auto-merge $BRANCH_NAME into main"
          git push origin main

      - name: Delete merged branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: git push origin --delete "$BRANCH_NAME"
