name: CI + Auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  validate:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'cursor/')
    permissions:
      contents: read
    steps:
      - name: Checkout trusted script from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: _main
          sparse-checkout: scripts/check_consistency.py
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _feature
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run consistency check
        run: python _main/scripts/check_consistency.py --root _feature

      - name: Validate HTML
        run: |
          python3 -c "
import html.parser, pathlib, sys
class Validator(html.parser.HTMLParser):
    def __init__(self):
        super().__init__(convert_charrefs=False)
        self.errors = []
    def unknown_decl(self, data):
        self.errors.append(f'Unknown declaration: {data}')
p = Validator()
try:
    p.feed(pathlib.Path('_feature/index.html').read_text(encoding='utf-8'))
except Exception as e:
    print(f'Parse error: {e}'); sys.exit(1)
if p.errors:
    [print(e) for e in p.errors]; sys.exit(1)
print('HTML syntax OK')
"

  automerge:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash'
            })
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.payload.pull_request.head.ref}`
            })
